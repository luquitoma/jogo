[Application]
app.classpath=$APPDIR\jogo.jar
app.mainclass=App
app.classpath=$APPDIR\javafx\javafx.base.jar
app.classpath=$APPDIR\javafx\javafx.controls.jar
app.classpath=$APPDIR\javafx\javafx.fxml.jar
app.classpath=$APPDIR\javafx\javafx.graphics.jar
app.classpath=$APPDIR\javafx\javafx.media.jar

[JavaOptions]
java-options=-Djpackage.app-version=1.0.0
java-options=--module-path
java-options=$APPDIR\javafx
java-options=--add-modules
java-options=javafx.controls,javafx.fxml,javafx.media
java-options=--enable-native-access=javafx.graphics,javafx.media
java-options=-Djava.library.path=$APPDIR
